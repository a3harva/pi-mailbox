[project]
name = "pi-mailbox"
version = "0.1.0"
description = "A durable, local, file-based mailbox so Pi coding agents on one machine can message each other."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Atharva Joshi" }]
requires-python = ">=3.14"
dependencies = ["mcp>=2.3,<3"]
keywords = ["pi", "mcp", "agents", "mailbox", "tmux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/a3harva/pi-mailbox"

[project.scripts]
pi-mailbox = "pi_mailbox.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
