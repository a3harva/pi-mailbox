[project]
name = "agent-mailbox"
version = "0.1.0"
description = "A durable local mailbox so coding agents (Claude Code, Pi, any MCP client) on one machine can message each other."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Atharva Joshi" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]
keywords = ["mcp", "agents", "mailbox", "claude-code", "pi", "tmux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/a3harva/agent-mailbox"

[project.scripts]
agent-mailbox = "agent_mailbox.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.2", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["tmux: needs a tmux binary"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
